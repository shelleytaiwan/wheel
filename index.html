<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>轉盤抽籤</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#fff;display:flex;color:#3b2a1a;overflow:hidden}
#panel{width:340px;max-width:42vw;height:100%;overflow:auto;background:#fff8ef;padding:14px;border-right:2px solid #e8c9a4;display:flex;flex-direction:column;gap:10px;flex:none}
h1{font-size:20px;margin:0}
.row{display:flex;gap:6px;flex-wrap:wrap}
select,textarea,button{font:inherit}
select{flex:1;min-width:0;padding:7px;border:1px solid #d9b98f;border-radius:8px;background:#fff}
textarea{width:100%;height:210px;padding:8px;border:1px solid #d9b98f;border-radius:8px;resize:vertical;font-size:17px;line-height:1.5}
button.b{padding:7px 11px;border:1px solid #d9b98f;background:#fff;border-radius:8px;cursor:pointer;font-size:14px}
button.b:active{background:#f6e3cc}
button.main{background:#e8743b;color:#fff;border-color:#e8743b;font-weight:700}
.small{font-size:12px;color:#7a6350;line-height:1.5}
#thumbs{display:flex;flex-wrap:wrap;gap:6px}
.th{position:relative;width:54px;height:54px;border-radius:8px;overflow:hidden;border:1px solid #d9b98f}
.th img{width:100%;height:100%;object-fit:cover}
.th i{position:absolute;right:0;top:0;background:#000a;color:#fff;font-style:normal;width:20px;height:20px;text-align:center;line-height:20px;cursor:pointer}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
#wrap{position:relative}
#cv{display:block}
#go{position:absolute;left:50%;top:50%;width:12.5%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;padding:6%;border-radius:50%;cursor:pointer;background:conic-gradient(#ef4444,#f59e0b,#facc15,#22c55e,#06b6d4,#3b82f6,#a855f7,#ef4444);box-shadow:0 3px 10px #0005;transition:transform .15s}
#go:hover{transform:translate(-50%,-50%) scale(1.06)}
#go:disabled{opacity:.6;cursor:default}
#go div{width:100%;height:100%;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
#go svg{width:52%;height:52%}
#go .pl{margin-left:8%}
#go .rf{display:none}
#go.done .pl{display:none}
#go.done .rf{display:block}
#arrow{position:absolute;left:46%;top:31.5%;width:8%;height:14%;filter:drop-shadow(0 2px 3px #0005);pointer-events:none}
#credit{position:fixed;bottom:5px;left:0;right:0;text-align:center;font-size:12px;color:#6b4a2a99;pointer-events:none;z-index:5}
#res{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;padding:4vmin;text-align:center;cursor:pointer}
#res .card{background:#fffdf8;border-radius:5vmin;padding:6vmin 8vmin;max-width:94vw;max-height:92vh;box-shadow:0 10px 50px #0008;animation:pop .35s}
#res .t{font-weight:900;color:#c2410c;word-break:break-all;line-height:1.25}
#res img{max-width:80vw;max-height:70vh;border-radius:3vmin;display:block;margin:auto}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#bar{display:none;position:fixed;left:10px;top:10px;z-index:6;gap:8px}
body.student #bar{display:flex}
#bar button,#resbar button{font:inherit;font-size:16px;padding:9px 16px;border:1px solid #d9b98f;background:#fff;border-radius:22px;cursor:pointer}
#bar button{opacity:.9}
#resbar{display:none;gap:14px;justify-content:center;margin-top:3vmin}
#resbar button{font-size:20px;padding:12px 24px;font-weight:700}
.pulse{animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.08);background:#ffe3cf}}
body.shared #edit,body.shared #rEdit{display:none}
body.student #panel{display:none}
@media (max-width:700px){body{flex-direction:column}#panel{width:100%;max-width:none;height:44%;border-right:0;border-bottom:2px solid #e8c9a4}}
</style>
</head>
<body>
<div id="panel">
  <h1>轉盤抽籤</h1>
  <div class="row">
    <select id="sel"></select>
    <button class="b" id="bNew">＋新增</button>
    <button class="b" id="bRen">改名</button>
    <button class="b" id="bDel">刪除</button>
  </div>
  <textarea id="txt" placeholder="一行一個項目（姓名、詞語、句子…）"></textarea>
  <div class="row">
    <button class="b" id="bImg">🖼 上傳圖片</button>
    <input type="file" id="fImg" accept="image/*" multiple hidden>
    <label class="small" style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="rm"> 抽過的從轉盤移除</label>
  </div>
  <div id="thumbs"></div>
  <div class="small" id="status"></div>
  <div class="row">
    <button class="b main" id="bStu">▶ 學生模式（只顯示轉盤）</button>
    <button class="b" id="bRound">重置本輪</button>
  </div>
  <div class="row">
    <button class="b" id="bLink">複製學生連結</button>
    <button class="b" id="bExp">匯出備份</button>
    <button class="b" id="bImp">匯入備份</button>
    <input type="file" id="fImp" accept=".json,application/json" hidden>
  </div>
  <div class="small">自動儲存在這台裝置的瀏覽器。換裝置（家裡電腦 → 學校 iPad）：在家按「匯出備份」，把檔案用 AirDrop／iCloud／LINE 傳到 iPad，再按「匯入備份」。只有文字的項目也可用「複製學生連結」直接傳連結。學生模式左上角有「再一次」和「回編輯頁」按鈕（Esc 也可回編輯頁）。每次抽的順序都是隨機的，按「再一次」還會重新打亂轉盤上的排列。</div>
</div>
<div id="stage">
  <div id="wrap">
    <canvas id="cv"></canvas>
    <svg id="arrow" viewBox="0 0 40 70"><polygon points="20,3 37,28 26,28 26,68 14,68 14,28 3,28" fill="#ef4444" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>
    <button id="go" aria-label="spin"><div><svg class="pl" viewBox="0 0 24 24"><path d="M4 2 L22 12 L4 22 Z" fill="#e5484d"/></svg><svg class="rf" viewBox="0 0 24 24" fill="none" stroke="#e5484d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a8 8 0 1 0 7.5 5.4"/><path d="M20 3v7h-7"/></svg></div></button>
  </div>
</div>
<div id="bar"><button id="again">↻ 再一次</button><button id="edit">✎ 回編輯頁</button></div>
<div id="credit">Shelleytaiwan製作 2026請勿商用</div>
<div id="res"><div class="card" id="card"></div><div id="resbar"><button id="rAgain" class="pulse">↻ 再一次</button><button id="rEdit">✎ 回編輯頁</button></div></div>

function load(){
  try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.projects)db=Object.assign(db,d)}catch(e){}
  if(!db.projects.length){db.projects=[{id:uid(),name:'點名',text:'',images:[]}];db.last=db.projects[0].id}
  if(!db.projects.find(p=>p.id===db.last))db.last=db.projects[0].id;
}
function save(){if(shared)return;try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){alert('儲存空間不足：請減少圖片，或先匯出備份')}}
const cur=()=>shared?tmp:db.projects.find(p=>p.id===db.last);
const getItems=()=>{const p=cur();return p.text.split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({t})).concat(p.images.map(s=>({img:s})))};
function displayList(items){return perm.filter(i=>i<items.length).map(i=>Object.assign({i},items[i])).filter(x=>done||!db.remove||!drawn.has(x.i))}
function shuffle(){const a=getItems().map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}perm=a}
function syncSig(items){const s=items.map((x,i)=>i+(x.t||'#'+x.img.length)).join('\u0001');if(s!==sig){sig=s;drawn.clear();round=1;done=false;perm=items.map((_,i)=>i)}}

/* ---------- drawing ---------- */
function getImg(src){let im=imgCache[src];if(!im){im=new Image();im.onload=draw;im.src=src;imgCache[src]=im}return im}
const wAt=(r,seg)=>2*r*Math.sin(Math.min(seg/2,Math.PI/2))*0.92;

function draw(){
  const items=getItems();syncSig(items);
  const list=displayList(items),n=list.length,dpr=window.devicePixelRatio||1;
  const cv=$('cv');cv.width=cv.height=Math.round(W*dpr);cv.style.width=cv.style.height=W+'px';
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,W);
  const R=W/2,cx=R,cy=R,Rw=R*0.955;
  const g=c.createLinearGradient(0,0,W,W);g.addColorStop(0,'#fafafa');g.addColorStop(.5,'#b5b5b5');g.addColorStop(1,'#f0f0f0');
  c.fillStyle=g;c.beginPath();c.arc(cx,cy,R*0.995,0,TAU);c.fill();
  if(!n){c.fillStyle='#e3e3e3';c.beginPath();c.arc(cx,cy,Rw,0,TAU);c.fill()}
  else{
    const seg=TAU/n;
    for(let i=0;i<n;i++){
      const a0=theta+i*seg-Math.PI/2;
      c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,Rw,a0,a0+seg);c.closePath();
      c.fillStyle=`hsl(${(i*360/n+355)%360},78%,${i%2?58:63}%)`;c.fill();
      if(done||(!db.remove&&drawn.has(list[i].i))){c.fillStyle='rgba(255,255,255,.7)';c.fill()}
      if(n>1){c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.5;c.stroke()}
    }
    const rIn=R*0.40,rOut=R*0.925,radLen=rOut-rIn,w=wAt(rIn+radLen*.3,seg);
    for(let i=0;i<n;i++){
      c.save();c.translate(cx,cy);c.rotate(theta+(i+.5)*seg);
      const it=list[i];
      if(it.img)labelImg(c,it.img,rIn,radLen,w);
      else if(CJK.test(it.t))labelV(c,it.t,rIn,rOut,radLen,w);
      else labelH(c,it.t,rOut,radLen,w);
      c.restore();
    }
  }
  const hg=c.createRadialGradient(cx,cy,R*.05,cx,cy,R*.19);hg.addColorStop(0,'#fff');hg.addColorStop(1,'#ececec');
  c.fillStyle=hg;c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=R*.04;c.beginPath();c.arc(cx,cy,R*0.18,0,TAU);c.fill();c.shadowBlur=0;
  $('go').disabled=spinning||!n;$('go').classList.toggle('done',done);$('again').classList.toggle('pulse',done);
  updateStatus(items.length);
}
function txtStyle(c,size){c.font=`900 ${size}px ${FONT}`;c.lineWidth=size*.13;c.lineJoin='round';c.strokeStyle='rgba(60,20,0,.55)';c.fillStyle='#fff';c.textBaseline='middle'}
function labelV(c,txt,rIn,rOut,radLen,w){
  const ch=[...txt],N=ch.length,s=Math.min(Math.min(radLen/N,w)*0.93,radLen*0.6);
  txtStyle(c,s);c.textAlign='center';
  const y0=-rOut+(radLen-N*s)/2+s/2;
  ch.forEach((t,j)=>{const y=y0+j*s;c.strokeText(t,0,y);c.fillText(t,0,y)});
}
function labelH(c,txt,rOut,radLen,w){
  const opts=[[txt]],sp=txt.split(' ');
  if(sp.length>1){const h=Math.ceil(sp.length/2);opts.push([sp.slice(0,h).join(' '),sp.slice(h).join(' ')])}
  let best=null;c.font=`900 100px ${FONT}`;
  for(const L of opts){const m=Math.max(...L.map(s=>c.measureText(s).width));const size=Math.min(radLen*.95/m*100,w*.9/(L.length*1.15));if(!best||size>best.size)best={size,L}}
  const size=Math.min(best.size,radLen*.4);
  c.rotate(-Math.PI/2);txtStyle(c,size);c.textAlign='right';
  best.L.forEach((s,j)=>{const y=(j-(best.L.length-1)/2)*size*1.15;c.strokeText(s,rOut*0.97,y);c.fillText(s,rOut*0.97,y)});
}
function labelImg(c,src,rIn,radLen,w){
  const im=getImg(src);if(!im.complete||!im.naturalWidth)return;
  const s=Math.min(radLen*.92,w*.95),k=Math.min(s/im.naturalWidth,s/im.naturalHeight),iw=im.naturalWidth*k,ih=im.naturalHeight*k,cy=-(rIn+radLen/2);
  c.drawImage(im,-iw/2,cy-ih/2,iw,ih);c.strokeStyle='#fff';c.lineWidth=3;c.strokeRect(-iw/2,cy-ih/2,iw,ih);
}

/* ---------- spin ---------- */
function spin(){
  if(spinning)return;
  const items=getItems();if(!items.length||done)return;syncSig(items);
  const list=displayList(items),n=list.length,seg=TAU/n;
  const rem=list.map((x,k)=>({k,i:x.i})).filter(x=>!drawn.has(x.i));
  const pick=rem[Math.random()*rem.length|0];
  const jitter=(Math.random()-.5)*seg*.7;
  const tgt=-((pick.k+.5)*seg+jitter);
  let delta=(tgt-(theta%TAU))%TAU;if(delta<0)delta+=TAU;
  const base=TAU*2.5;delta=base+(((tgt-(theta+base))%TAU)+TAU)%TAU;
  try{SND.currentTime=0;SND.play()}catch(e){}
  const t0=performance.now(),dur=2400,th0=theta;spinning=true;draw();
  (function f(now){
    const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,2.6);
    theta=th0+delta*e;draw();
    if(p<1)requestAnimationFrame(f);
    else{try{SND.pause();SND.currentTime=0}catch(e){}theta%=TAU;spinning=false;draw();showResult(items[pick.i],pick.i)}
  })(t0);
}
function showResult(it,i){
  pending=i;$('resbar').style.display=(drawn.size+1>=getItems().length)?'flex':'none';const card=$('card');
  if(it.img)card.innerHTML=`<img src="${it.img}">`;
  else{const len=[...it.t].length;card.innerHTML='';const d=document.createElement('div');d.className='t';d.style.fontSize=Math.max(5,Math.min(22,70/Math.max(len,3)))+'vmin';d.textContent=it.t;card.appendChild(d)}
  $('res').style.display='flex';
}
function closeRes(){
  $('res').style.display='none';
  if(pending!==null){drawn.add(pending);pending=null;if(drawn.size>=getItems().length)done=true;draw()}
}
function again(){closeRes();drawn.clear();if(done)round++;done=false;shuffle();draw()}
$('res').onclick=closeRes;
$('rAgain').onclick=e=>{e.stopPropagation();again()};
$('rEdit').onclick=e=>{e.stopPropagation();closeRes();exitStu()};

/* ---------- layout ---------- */
function resize(){
  const st=$('stage');W=Math.floor(Math.min(st.clientWidth,st.clientHeight-22)*0.98);
  if(W<100)W=100;$('wrap').style.width=$('wrap').style.height=W+'px';draw();
}
new ResizeObserver(resize).observe($('stage'));

/* ---------- panel ---------- */
function updateStatus(total){$('status').textContent=`共 ${total} 格｜已抽 ${drawn.size}｜第 ${round} 輪`}
function renderPanel(){
  const s=$('sel');s.innerHTML='';
  db.projects.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;s.appendChild(o)});
  s.value=db.last;const p=cur();$('txt').value=p.text;$('rm').checked=!!db.remove;
  const t=$('thumbs');t.innerHTML='';
  p.images.forEach((src,k)=>{const d=document.createElement('div');d.className='th';d.innerHTML=`<img src="${src}"><i>×</i>`;d.querySelector('i').onclick=()=>{p.images.splice(k,1);save();renderPanel();draw()};t.appendChild(d)});
}
$('sel').onchange=e=>{db.last=e.target.value;save();renderPanel();draw()};
$('txt').oninput=e=>{cur().text=e.target.value;save();draw()};
$('rm').onchange=e=>{db.remove=e.target.checked;save();draw()};
$('bNew').onclick=()=>{const n=prompt('新項目名稱（例如：點名、會話、量詞）');if(!n)return;const p={id:uid(),name:n,text:'',images:[]};db.projects.push(p);db.last=p.id;save();renderPanel();draw()};
$('bRen').onclick=()=>{const p=cur(),n=prompt('改名',p.name);if(!n)return;p.name=n;save();renderPanel()};
$('bDel').onclick=()=>{const p=cur();if(!confirm(`確定刪除「${p.name}」？`))return;db.projects=db.projects.filter(x=>x.id!==p.id);if(!db.projects.length)db.projects.push({id:uid(),name:'點名',text:'',images:[]});db.last=db.projects[0].id;save();renderPanel();draw()};
$('bRound').onclick=()=>{drawn.clear();round=1;done=false;shuffle();draw()};
$('bImg').onclick=()=>$('fImg').click();
$('fImg').onchange=async e=>{
  for(const f of e.target.files){cur().images.push(await shrink(f))}
  e.target.value='';save();renderPanel();draw();
};
function shrink(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,420/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)})}
$('bStu').onclick=()=>{document.body.classList.add('student','local');setTimeout(resize,50)};
const exitStu=()=>{if(!shared){document.body.classList.remove('student','local');setTimeout(resize,50)}};
$('edit').onclick=exitStu;$('again').onclick=again;
addEventListener('keydown',e=>{if(e.key==='Escape')exitStu()});
$('go').onclick=()=>done?again():spin();
$('bLink').onclick=()=>{
  const p=cur();if(p.images.length)alert('提醒：連結只包含文字項目，圖片請用「匯出備份」。');
  const d={n:p.name,t:p.text.split('\n').map(s=>s.trim()).filter(Boolean)};
  const url=location.href.split('#')[0]+'#s='+encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d)))));
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>alert('已複製學生連結'),()=>prompt('請複製連結：',url));
};
$('bExp').onclick=()=>{
  const b=new Blob([JSON.stringify({app:'wheel',projects:db.projects,last:db.last,remove:db.remove})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='轉盤抽籤備份.json';a.click();
};
$('bImp').onclick=()=>$('fImp').click();
$('fImp').onchange=async e=>{
  try{
    const d=JSON.parse(await e.target.files[0].text());let n=0;
    d.projects.forEach(p=>{const k=db.projects.findIndex(x=>x.id===p.id);if(k>=0)db.projects[k]=p;else db.projects.push(p);n++});
    if(d.last)db.last=d.last;save();renderPanel();draw();alert(`已匯入 ${n} 個項目`);
  }catch(err){alert('檔案無法讀取')}
  e.target.value='';
};

/* ---------- init ---------- */
(function(){
  const m=location.hash.match(/^#s=(.+)$/);
  if(m){try{const d=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));tmp={id:'tmp',name:d.n,text:d.t.join('\n'),images:[]};shared=true;document.body.classList.add('student','shared')}catch(e){}}
  if(!shared)load();
  else db.remove=true;
  renderPanel();resize();
})();
</script>
</body>
